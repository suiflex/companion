# Path -> label map for the PR area labeler (the `label` job in
# .github/workflows/suiflex.yml).
#
# Mostly one entry per npm workspace, so a reviewer can tell from the label row
# which parts of the monorepo a pull request touches without opening the diff.
# A few entries deliberately overlap a workspace label because the files under
# them rot on their own schedule or want different reviewers — 'area: capture'
# and 'area: rust' are both inside larger areas on purpose.
#
# Adding a workspace means adding it here as well as to package.json's
# `workspaces` — nothing checks that this file stayed in sync.


"area: extension":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/extension/**"

# Deliberately overlaps 'area: extension'. content.js is the one file that rots
# on its own schedule — Google Meet rotates its obfuscated class names every few
# months — so a change to it is worth seeing without opening the diff.
"area: capture":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/extension/public/content.js"

"area: desktop":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/desktop/**"

# Deliberately inside 'area: desktop'. The Rust crate is the one part of this
# repository with a different toolchain and a different CI job, so a change to
# it is worth seeing without opening the diff.
"area: rust":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/desktop/src-tauri/**"

"area: vault":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/vault/**"

# The extension -> native host -> vault path, which spans three workspaces and
# is the one thing in this repo that breaks in the seam between them.
"area: bridge":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/desktop/native-host.ts"
          - "apps/extension/src/lib/bridgeBatch.ts"
          - "packages/vault/src/bridge.ts"

"area: ai":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/ai/**"

"area: meeting":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/meeting/**"

"area: store":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/store/**"

"area: shared":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/shared/**"

"area: mcp":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/mcp/**"

"area: sync-server":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/sync-server/**"

"area: exporters":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/exporters/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"

"area: brand":
  - changed-files:
      - any-glob-to-any-file:
          - "assets/brand/**"
          - "scripts/gen-icons.mjs"

# The installer and packaging scripts ship to users without going through a
# build, so a change here reaches people the moment it lands on develop.
"area: installer":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/companion.mjs"
          - "scripts/install.sh"
          - "scripts/install.ps1"
          - "scripts/pack.mjs"
          - "scripts/zip.mjs"
          - "scripts/unzip.mjs"
          - "scripts/picker.mjs"
          - "apps/desktop/scripts/install-native-host.sh"
          - "apps/desktop/scripts/install-native-host.ps1"

"area: release":
  - changed-files:
      - any-glob-to-any-file:
          - "release-please-config.json"
          - ".release-please-manifest.json"
          - "CHANGELOG.md"
          # release-please bumps the desktop's version files from the root
          # package, so they move on a release like the extension's do.
          - "apps/desktop/package.json"
          - "apps/desktop/src-tauri/tauri.conf.json"
          - "apps/desktop/src-tauri/Cargo.toml"
