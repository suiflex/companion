name: Release Desktop

# Runs only on a Companion Desktop tag. The extension has its own tag shape
# (`v*`) and its own workflow (release.yml); the two products are released
# independently and neither triggers the other.
#
# Each platform builds on its own runner because Tauri bundles natively: a
# .dmg needs macOS, an .msi needs Windows. A single runner cannot produce the
# set, so the matrix is not an optimisation but the only way.

on:
  push:
    tags: ['companion-desktop-v*']
  workflow_dispatch:

permissions:
  contents: write # attach installers to the Release

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      # One platform failing to bundle must not withhold the others: a partial
      # release the maintainer can top up beats no release at all.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Both Apple architectures from one runner.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            rust-targets: ''
          - os: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cargo's registry and the build dir dominate the runtime here; the Rust
      # crate is small but Tauri's dependency tree is not.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # webkit2gtk is the Linux WebView; libappindicator and librsvg are what
      # the AppImage bundler links against.
      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Install
        run: npm ci

      # The tag ships what CI verified; this runs again only as a guard against
      # a tag pushed from an unverified tree.
      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npx vitest run

      # No --features wdio: the WebDriver plugin is test-only and must not be
      # in anything a user installs.
      - name: Build the desktop bundles
        run: npx tauri build ${{ matrix.args }}
        working-directory: apps/desktop

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
