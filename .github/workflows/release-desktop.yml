name: Release Desktop

# Runs only on a Companion Desktop tag. The extension has its own tag shape
# (`v*`) and its own workflow (release.yml); the two products are released
# independently and neither triggers the other.
#
# Each platform builds on its own runner because Tauri bundles natively: a
# .dmg needs macOS, an .msi needs Windows. A single runner cannot produce the
# set, so the matrix is not an optimisation but the only way.
#
# One leg per architecture, never a universal build: a per-arch bundle is what
# an updater manifest has to name, and a failed arch then costs that arch
# alone. v0.2.0 shipped macOS-only because a shared step failed on two legs.

on:
  push:
    tags: ['companion-desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to
        required: true
        type: string

permissions:
  contents: write # attach installers to the Release

concurrency:
  group: release-desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  bundle:
    strategy:
      # One platform failing to bundle must not withhold the others: a partial
      # release the maintainer can top up beats no release at all.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            # Cross-compiled from Apple Silicon: the x86_64 macOS runners are
            # scarce, and nothing here needs to execute the binary it builds.
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            # Oldest supported glibc/webkit — the binary has to run on distros
            # older than the runner, so the floor is deliberate.
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            experimental: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            experimental: true
    runs-on: ${{ matrix.os }}
    # Best-effort arm legs: the runners are new and their toolchains still
    # move. A missing arm asset is a gap, not a failed release.
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cargo's registry and the build dir dominate the runtime here; the Rust
      # crate is small but Tauri's dependency tree is not. Keyed per target so
      # the two macOS legs do not fight over one cache.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release-${{ matrix.target }}

      # webkit2gtk is the Linux WebView; libappindicator and librsvg are what
      # the AppImage bundler links against.
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Install
        run: npm ci

      # v0.3.0 died here after every leg had already built its installers: the
      # signing secrets were never set, and Tauri only says so once the bundles
      # exist. Ten seconds and a readable message beats twenty minutes across
      # six runners.
      - name: Check the signing key is available
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Updater bundles cannot be signed." \
                 "Set it (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) in the repository secrets."
            exit 1
          fi

      # No test step. `ci.yml` gates every PR, and a tag is cut from a branch
      # that already passed it; re-running the whole JS suite on six runners
      # only adds six chances for a platform-flaky test to block a bundle that
      # would have been fine.
      #
      # No --features wdio: the WebDriver plugin is test-only and must not be
      # in anything a user installs.
      - name: Build the desktop bundles
        run: npx tauri build --target ${{ matrix.target }}
        working-directory: apps/desktop
        env:
          # Signs the updater bundles. This is our own key, checked by the
          # pubkey compiled into the app — it has nothing to do with Apple
          # notarization, and Gatekeeper still warns on a fresh download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # release-please has already created the release for this tag. Creating
      # it here is only a fallback for a hand-pushed tag; the leg that loses
      # the race fails harmlessly and uploads anyway.
      - name: Ensure the release exists
        # `always()` from here down: if signing fails the installers on disk are
        # still good, and a release missing only its updater manifest beats a
        # release missing everything. The manifest job then fails, loudly.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || true

      # Every other bundler puts the architecture in the filename; the macOS
      # updater tarball is just "Companion Desktop.app.tar.gz", so without this
      # the second Apple leg would overwrite the first one's asset.
      - name: Name the macOS updater bundle after its architecture
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          # Reached even on a failed build, where the directory may not exist.
          [ -d "$dir" ] || exit 0
          cd "$dir"
          for f in *.app.tar.gz; do
            base="${f%.app.tar.gz}.${{ matrix.target }}.app.tar.gz"
            mv "$f" "$base"
            # Absent when signing failed; the tarball is still worth shipping.
            if [ -f "$f.sig" ]; then mv "$f.sig" "$base.sig"; fi
          done

      # Each leg tops up the same release independently, so re-running one
      # failed architecture never touches the assets the others uploaded.
      - name: Upload bundles to the Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dir=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          # A build that failed before bundling has nothing to upload; the job
          # is already red, so say why and stop rather than erroring on a cd.
          if [ ! -d "$dir" ]; then
            echo "no bundles were produced for ${{ matrix.target }}"
            exit 0
          fi
          cd "$dir"
          find . -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.sig' \
          \) -print0 > /tmp/bundles
          if [ ! -s /tmp/bundles ]; then
            echo "no bundles were produced for ${{ matrix.target }}"
            exit 0
          fi
          xargs -0 -t gh release upload "$TAG" --clobber < /tmp/bundles

  # Fan-in: the six legs never see each other, so the manifest is built from
  # what actually reached the release. `always()` because an experimental arm
  # leg is allowed to fail without withholding the manifest for the rest.
  manifest:
    needs: [bundle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the signed bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > assets.json
          mkdir -p sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*.sig' -D sigs --clobber

      - name: Build latest.json
        run: |
          python3 .github/scripts/updater_manifest.py --selftest
          python3 .github/scripts/updater_manifest.py "$TAG" assets.json sigs latest.json

      # Two homes. The tag's own release keeps the manifest that shipped with
      # it; the rolling `companion-desktop-latest` release is what installed
      # apps poll. It cannot be /releases/latest/ — that alternates with the
      # extension's `v*` releases, which carry no manifest at all. Marked a
      # prerelease so this pointer never becomes the repo's "Latest" itself.
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release view companion-desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create companion-desktop-latest --repo "$GITHUB_REPOSITORY" \
                 --prerelease --title 'Desktop update manifest' \
                 --notes 'Rolling pointer the desktop app polls for updates. Not a download — see the tagged releases.'
          gh release upload companion-desktop-latest latest.json --repo "$GITHUB_REPOSITORY" --clobber
