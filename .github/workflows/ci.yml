name: CI

# Verification for every push and pull request. Failures here block a merge;
# nothing is published.
#
# Both jobs call `make` rather than the underlying npm and cargo commands, so
# what CI runs and what CONTRIBUTING tells you to run cannot drift apart: they
# are the same target in the same file.
#
# The release machinery lives in release.yml (v* tags, the extension) and
# release-desktop.yml (companion-desktop-v* tags, the app): artifacts, GitHub
# Releases and the AMO submission stay out of the PR loop, so a Mozilla rate
# limit can never turn a green branch red.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `make ci` is the gate CONTRIBUTING names: typecheck, lint, tests, the
      # extension bundle, and the three smokes. Its Rust half is skipped here —
      # the desktop job below owns that, and this runner has no toolchain.
      - name: Verify
        run: make ci-js

  # The desktop app's Rust half never compiled in CI until a release tag was
  # already pushed, which is the worst possible moment to learn it does not
  # build. This job moves that to the pull request.
  #
  # The job always runs and always reports; only its expensive steps are
  # conditional. Filtering the whole job on `paths:` would be simpler and is a
  # trap: a required status check that never reports on an unrelated pull
  # request blocks the merge forever.
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to diff against the base commit below.
          fetch-depth: 0

      # packages/vault is on the list because the desktop app depends on it;
      # leaving it off is how a path filter grows a hole.
      - name: Does this change touch the desktop?
        id: scope
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no base commit to diff against; checking anyway"
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE \
              '^(apps/desktop/|packages/vault/|package(-lock)?\.json|tsconfig\.json|Makefile|\.github/workflows/ci\.yml)'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "nothing under apps/desktop or packages/vault changed"
          fi

      # No Node here on purpose: `make ci-rust` is pure cargo, and the crate
      # builds without a frontend dist — verified by running it against a tree
      # with apps/desktop/dist removed and build.rs forced to re-run.
      - if: steps.scope.outputs.touched == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The crate itself is small; Tauri's dependency tree is not.
      - if: steps.scope.outputs.touched == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # webkit2gtk is the Linux WebView; the rest is what tauri-build links.
      - name: Install Linux WebView dependencies
        if: steps.scope.outputs.touched == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      # Format, clippy, and cargo check twice — the second pass with the
      # test-only `wdio` feature, which a release build compiles out and so
      # would otherwise break unnoticed until someone ran the desktop suite.
      - name: Verify the Rust crate
        if: steps.scope.outputs.touched == 'true'
        run: make ci-rust
