name: Release

# Runs only on a tag push (v*). Three jobs, each independently retryable:
#
#   artifacts — pack the Chromium/Firefox zips and the AMO source archive,
#               attach them to the GitHub Release. Pure local work.
#   amo       — submit the Firefox build to Mozilla's review queue. The only
#               step that depends on a third party; AMO throttles hard enough
#               that an upload can be refused for half an hour, so the job
#               retries with backoff and can be re-run alone after a failure
#               without touching the already-published release.
#
# Artifacts are published before the AMO submission on purpose: our own
# distribution must not fail because Mozilla's rate limiter said no. When amo
# goes red the release is already out and only this job has to be retried
# (Actions tab -> Release -> Re-run failed jobs).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach zips to the Release

env:
  # AMO's rate limiter answers 429 with a "try again in N seconds" window that
  # has measured up to half an hour on this add-on. Four attempts spaced out
  # cover the observed throttle lengths; the job stays well under GitHub's
  # six-hour ceiling.
  AMO_ATTEMPTS: 4

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # the tag release ships what CI verified; the suite runs again only as a
      # guard against a tag pushed from an unverified tree
      - name: Typecheck, lint, test
        run: make check-all-js && make test

      - name: Build
        run: make build-extension

      # The standalone `companion install` fetches this to register the desktop
      # bridge; without it on the release, the bridge can only be installed from
      # a repo checkout.
      - name: Build the native-messaging host
        run: make build-host

      - name: Read version from manifest
        id: meta
        run: echo "version=$(node -p "require('./apps/extension/public/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Name the host asset after the release
        run: cp apps/desktop/dist-native/native-host.mjs "companion-native-host-v${{ steps.meta.outputs.version }}.mjs"

      # one build, two manifests: Chromium takes dist as-is, Gecko needs an
      # event page instead of a service worker (see scripts/pack.mjs)
      - name: Pack the Chromium and Firefox artifacts
        run: make pack

      # AMO requires the source when the reviewed files are minified, and ours
      # are a Vite bundle. REVIEWERS.md rebuilds the exact tree from it.
      - name: Pack the source archive for AMO
        run: make pack-source

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            meetcc-extension-v*.zip
            meetcc-extension-firefox-v*.zip
            meetcc-source-v*.zip
            companion-native-host-v*.mjs

  amo:
    needs: artifacts
    runs-on: ubuntu-latest
    # Skipped on a fork, where the secret is absent: a fork's tag build still
    # produces its artifacts, and the run stays green.
    if: github.repository_owner == 'suiflex'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Read version from manifest
        id: meta
        run: echo "version=$(node -p "require('./apps/extension/public/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Name the host asset after the release
        run: cp apps/desktop/dist-native/native-host.mjs "companion-native-host-v${{ steps.meta.outputs.version }}.mjs"

      # rebuild exactly what the artifacts job packed: the AMO submission
      # uploads the source archive against this tree, and REVIEWERS.md
      # promises the reviewer a byte-identical rebuild.
      - name: Build
        run: make build-extension

      # The standalone `companion install` fetches this to register the desktop
      # bridge; without it on the release, the bridge can only be installed from
      # a repo checkout.
      - name: Build the native-messaging host
        run: make build-host

      - name: Pack the Chromium and Firefox artifacts
        run: make pack

      - name: Pack the source archive for AMO
        run: make pack-source

      # Submits to the listed channel, which puts it in Mozilla's review queue —
      # AMO then distributes and auto-updates it.
      #
      # The loop is the whole point of this job: the submit call fails on
      # Mozilla's side far more often than on ours, and every observed failure
      # so far has been a throttle ("Request was throttled. Expected available
      # in N seconds." — v1.6.0 after 1825s, v1.7.0 after 593s). web-ext has no
      # retry flag, so the backoff lives here: 60s, 5m, 15m between attempts.
      - name: Submit the Firefox build to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          set -u
          attempt=1
          max=$AMO_ATTEMPTS
          while [ "$attempt" -le "$max" ]; do
            echo "::group::AMO submission attempt ${attempt}/${max}"
            # Actions runs this block under `bash -e`, and a bare failing
            # command aborts the step — which would kill the retry loop on
            # attempt one. `|| status=$?` exempts the call from -e while
            # still capturing web-ext's real exit code.
            status=0
            # Not `make sign-firefox`: that target is the plain one-shot call,
            # while this loop owns the AMO retry policy described above.
            npx web-ext sign --channel=listed \
              --source-dir apps/extension/dist-firefox \
              --artifacts-dir web-ext-artifacts \
              --amo-metadata docs/amo/amo-metadata.json \
              --upload-source-code "meetcc-source-v${{ steps.meta.outputs.version }}.zip" || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "Submitted on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -eq "$max" ]; then
              echo "::error::AMO submission failed ${max} times (last exit ${status})."
              echo "::error::If the failure is a throttle, wait for the cooldown and re-run this job alone:"
              echo "::error::gh workflow run release.yml --ref ${GITHUB_REF_NAME}  (or Re-run failed jobs)."
              exit "$status"
            fi
            case "$attempt" in
              1) backoff=60 ;;
              2) backoff=300 ;;
              *) backoff=900 ;;
            esac
            echo "Attempt ${attempt} failed (exit ${status}). Retrying in ${backoff}s."
            sleep "$backoff"
            attempt=$((attempt + 1))
          done
