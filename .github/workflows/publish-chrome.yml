name: Publish Extension to Chrome Web Store

# Chrome Web Store publication is deliberately maintainer-triggered. Version
# bumps and GitHub releases do not publish to Chrome automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: make build-extension

      - name: Pack Chrome artifact
        run: npm run pack -- chrome

      - name: Read extension version
        id: meta
        run: echo "version=$(node -p \"require('./apps/extension/public/manifest.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@4008e29e13c144d0f6725462cbd49b7c291b4928 # v5.0.0
        with:
          file-path: meetcc-extension-v${{ steps.meta.outputs.version }}.zip
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
