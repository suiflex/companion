name: Build extension

# Every push to a long-lived branch (and manual runs) produces a ready-to-load
# dist artifact. `develop` is where the work lands, so it has to be checked
# here too — otherwise the suite only ever runs on a PR.
# Pushing a tag like v3.1.0 additionally publishes a GitHub Release with the
# Chromium zip and the Firefox zip attached — download, extract, load-unpacked.
# No install/build needed.

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach zip to the Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build -w apps/extension

      # both bins are bundled TypeScript; the smoke tests prove they start
      # under plain node and answer over stdio / HTTP
      - name: Build and smoke-test the MCP and sync servers
        run: |
          npm run build -w @meetcc/mcp
          npm run smoke -w @meetcc/mcp
          npm run build -w @meetcc/sync-server
          npm run smoke -w @meetcc/sync-server

      - name: Read version from manifest
        id: meta
        run: echo "version=$(node -p "require('./apps/extension/public/manifest.json').version")" >> "$GITHUB_OUTPUT"

      # one build, two manifests: Chromium takes dist as-is, Gecko needs an
      # event page instead of a service worker (see scripts/pack.mjs)
      - name: Pack the Chromium and Firefox artifacts
        run: npm run pack

      # per-run artifact: grab it from the Actions tab on any push/PR
      - uses: actions/upload-artifact@v4
        with:
          name: meetcc-extension-v${{ steps.meta.outputs.version }}
          path: apps/extension/dist
          if-no-files-found: error

      # AMO requires the source when the reviewed files are minified, and ours
      # are a Vite bundle. REVIEWERS.md rebuilds the exact tree from it.
      - name: Pack the source archive for AMO
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run pack:source

      # Submits to the listed channel, which puts it in Mozilla's review queue —
      # AMO then distributes and auto-updates it. Skipped on a fork, where the
      # secret is absent, so a fork's tag build still produces its artifacts.
      - name: Submit the Firefox build to AMO
        if: startsWith(github.ref, 'refs/tags/v') && env.WEB_EXT_API_KEY != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx web-ext sign --channel=listed \
            --source-dir apps/extension/dist-firefox \
            --artifacts-dir web-ext-artifacts \
            --upload-source-code "meetcc-source-v${{ steps.meta.outputs.version }}.zip"

      # tag push (v*) -> public Release with the zips attached. The Firefox
      # add-on itself is served by AMO, so only the source archive joins them.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            meetcc-extension-v*.zip
            meetcc-extension-firefox-v*.zip
            meetcc-source-v*.zip
