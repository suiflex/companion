name: release-please

on:
  # A maintainer starts release preparation explicitly after batching changes.
  workflow_dispatch:
  # A merged release PR is finalized automatically into a tag and release.
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Manual runs prepare/update the release PR. Pull request runs only
    # finalize a merged Release Please PR, never an application PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # A PAT rather than GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN does not
      # trigger another workflow, so build.yml would never see the v* tag and
      # the release would ship with no artifacts attached.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The tag stays vX.Y.Z (build.yml keys off `v*`); only the GitHub Release
      # display title gets the product name in front of it.
      - name: Prefix release title with product name
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh release edit "${{ steps.release.outputs.tag_name }}" \
            --title "Meet Companion ${{ steps.release.outputs.tag_name }}"
