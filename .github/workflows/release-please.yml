name: release-please

on:
  # A maintainer starts release preparation explicitly after batching changes.
  workflow_dispatch:
  # Every merge to develop. This both finalizes a merged release PR into a tag
  # and refreshes the *other* product's open release PR: the two versions share
  # one .release-please-manifest.json, so releasing the desktop app leaves the
  # extension's PR carrying a stale desktop version and conflicting (#38).
  # release-please rebases its own PRs, but only on a run.
  #
  # This replaces a `pull_request: [closed]` trigger rather than joining it:
  # merging a release PR is itself a push to develop, so both would fire and
  # the release would be created twice.
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # A PAT rather than GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN does not
      # trigger another workflow, so build.yml would never see the v* tag and
      # the release would ship with no artifacts attached.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Two products release from this repo on two tag shapes: the extension
      # keeps vX.Y.Z (release.yml keys off `v*`) and the desktop app uses
      # companion-desktop-vX.Y.Z (release-desktop.yml). Either or both can be
      # released in one run, so the display title is chosen per released path
      # rather than being a constant.
      - name: Prefix each release title with its product name
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -euo pipefail
          # The action prefixes an output with its path — except for the root
          # package, whose outputs stay unprefixed (setPathOutput in
          # release-please-action). Looking up `.--tag_name` returns null.
          for path in $(jq -r '.paths_released | fromjson | .[]' <<<"$OUTPUTS"); do
            if [ "$path" = "." ]; then prefix=""; else prefix="$path--"; fi
            tag=$(jq -er --arg k "${prefix}tag_name" '.[$k]' <<<"$OUTPUTS")
            version=$(jq -er --arg k "${prefix}version" '.[$k]' <<<"$OUTPUTS")
            case "$path" in
              apps/desktop) name="Companion Desktop" ;;
              *) name="Meet Companion" ;;
            esac
            gh release edit "$tag" --title "$name v$version"
          done
