name: release-please

on:
  # Maintainers prepare or update the release PR explicitly.
  workflow_dispatch:
  # Only a merged release-please PR finalizes a release. Ordinary PR merges
  # must never create a tag or GitHub Release.
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Attribute the pending release branch so the credited changelog is
      # already on develop when the release PR is merged.
      - name: Attribute contributors in the changelog
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")
          if [ -z "$branch" ]; then
            branch=$(gh pr list --state open --label "autorelease: pending" \
              --json headRefName --jq '.[0].headRefName')
          fi
          if [ -z "$branch" ]; then
            echo "no open release PR; nothing to attribute"
            exit 0
          fi
          script=$(mktemp)
          cp .github/scripts/attribute_changelog.py "$script"
          git fetch origin "$branch"
          git checkout "$branch"
          PRODUCT_NAME="Meet Companion" python3 "$script" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog already attributed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: attribute changelog contributors"
          git push origin "$branch"

      # Use the credited changelog block as the GitHub Release body.
      - name: Set release title and credited notes
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git checkout develop
          gh release edit "$TAG" --title "Meet Companion $TAG"
          version="${TAG#v}"
          awk -v h="[$version](" '
            index($0, "## " h) == 1 || index($0, "## Meet Companion: " h) == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ -s release-notes.md ] && grep -q '^### ' release-notes.md; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "no credited block for $version yet; leaving the body as-is"
          fi
          rm -f release-notes.md
