name: release-please

on:
  # A maintainer starts release preparation explicitly after batching changes.
  workflow_dispatch:
  # Every merge to develop, which finalizes a merged release PR into a tag.
  #
  # This replaces a `pull_request: [closed]` trigger rather than joining it:
  # merging a release PR is itself a push to develop, so both would fire and
  # the release would be created twice.
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # A PAT rather than GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN does not
      # trigger another workflow, so build.yml would never see the v* tag and
      # the release would ship with no artifacts attached.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please names a release after its tag; the extension and the
      # desktop app now ship from that one tag, so the title says the product
      # rather than the tag.
      - name: Prefix the release title with the product name
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh release edit "${{ steps.release.outputs.tag_name }}" \
            --title "Meet Companion v${{ steps.release.outputs.version }}"
