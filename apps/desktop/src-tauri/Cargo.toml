[package]
name = "companion-desktop"
version = "0.1.0"
description = "Companion Desktop — local-first vault for meeting notes"
authors = ["suiflex"]
edition = "2021"
rust-version = "1.77.2"

# The library is the Tauri app core; the bin is a thin launcher.
[lib]
name = "companion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
